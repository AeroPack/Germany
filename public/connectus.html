    return files.map((f, i) => ({ id: Date.now() + i, memberId, src: URL.createObjectURL(f), caption: f.name }));
  },
  async uploadCollagePhotos(files) {
    return files.map((f, i) => ({ id: `up-${Date.now()}-${i}`, src: URL.createObjectURL(f), caption: f.name }));
  },
};

const ThemeCtx = createContext({ theme: "light", toggle: () => {} });
const useTheme = () => useContext(ThemeCtx);

function ThemeProvider({ children }) {
  const [theme, setTheme] = useState(() => {
    try { return localStorage.getItem("cu-theme") || "light"; } catch { return "light"; }
  });
  useEffect(() => {
    try { localStorage.setItem("cu-theme", theme); } catch {}
    document.documentElement.setAttribute("data-theme", theme);
  }, [theme]);
  return (
    <ThemeCtx.Provider value={{ theme, toggle: () => setTheme(t => t === "light" ? "dark" : "light") }}>
      {children}
    </ThemeCtx.Provider>
  );
}

const CSS = `
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

}

}

button,input,select,textarea{font:inherit;color:inherit;}

.bar{

}

  padding:10px 12px 10px 40px;font-size:13px;outline:none;transition:border-color .2s,box-shadow .2s;
}
.bar-search input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-light);}
.bar-search input::placeholder{color:var(--txt3);}
.bar-r{margin-left:auto;display:flex;align-items:center;gap:10px;}

.ib{
  width:40px;height:40px;background:var(--surf);border:1px solid var(--border);

  cursor:pointer;color:var(--txt);transition:all .15s;
}
.ib:hover{background:var(--border);}
.notif-dot{
  position:absolute;width:8px;height:8px;background:#dc3545;border:2px solid var(--bg2);
  border-radius:50%;top:6px;right:6px;
}
.user-pill{
  display:inline-flex;align-items:center;gap:10px;
  background:var(--surf);border:1px solid var(--border);border-radius:8px;
  padding:5px 12px;cursor:pointer;font-size:13px;font-weight:500;transition:all .15s;
}
.user-pill:hover{background:var(--border);}
.btn-ghost{
  height:40px;padding:0 14px;background:transparent;border:1px solid var(--border);
  border-radius:8px;font-size:12px;font-weight:500;color:var(--txt2);cursor:pointer;
  transition:all .15s;
}
.btn-ghost:hover{color:var(--blue);border-color:var(--blue);}

.av{
  border-radius:50%;display:inline-flex;align-items:center;justify-content:center;
  font-weight:700;color:#fff;flex-shrink:0;background:#1e88e5;
}
.av.xs{width:24px;height:24px;font-size:9px;}
.av.sm{width:32px;height:32px;font-size:11px;}
.av.md{width:40px;height:40px;font-size:13px;}
.av.lg{width:56px;height:56px;font-size:18px;}
.av.xl{width:88px;height:88px;font-size:28px;}

.layout{
  display:grid;
  grid-template-columns:260px 1fr 280px;
  max-width:1400px;margin:0 auto;
  min-height:calc(100vh - 64px);
}
.side{
  height:calc(100vh - 64px);position:sticky;top:64px;overflow-y:auto;
  padding:20px 14px;border-right:1px solid var(--border);scrollbar-width:thin;scrollbar-color:var(--border) transparent;
}
.side.l{border-right:1px solid var(--border);}
.side.r{border-left:1px solid var(--border);border-right:0;}

.sec{margin-bottom:28px;}

}
.sec-cnt{background:var(--blue-light);color:var(--blue);padding:2px 7px;border-radius:6px;font-size:10px;font-weight:600;}

.mrow{

}
.mrow:hover{background:var(--surf);}
.mrow.act{background:var(--blue-light);}
.mrow.act::before{content:"";position:absolute;left:0;top:50%;transform:translateY(-50%);width:3px;height:55%;background:var(--blue);border-radius:2px;}
.mrow-info{flex:1;min-width:0;}
.mrow-name{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mrow-sub{font-size:11px;color:var(--txt3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px;}

.page-sub{font-size:14px;color:var(--txt2);margin-bottom:24px;}

.collage{
  background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  overflow:hidden;margin-bottom:24px;box-shadow:var(--sh);
}
.collage-head{
  padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;
  border-bottom:1px solid var(--border);
}
.collage-tit{font-size:16px;font-weight:700;letter-spacing:-.01em;}
.collage-sub{font-size:12px;color:var(--txt3);margin-top:2px;}
.collage-grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  grid-auto-rows:120px;gap:6px;padding:6px;
}
.ctile{
  border-radius:8px;overflow:hidden;cursor:pointer;position:relative;
  transition:transform .2s,box-shadow .2s;background:var(--surf);
}
.ctile:hover{transform:scale(1.02);box-shadow:var(--sh2);z-index:2;}
.ctile img{width:100%;height:100%;object-fit:cover;display:block;}

.ctile.lg{grid-column:span 2;grid-row:span 2;}

.upzone-ico{width:44px;height:44px;margin:0 auto 10px;border-radius:8px;background:var(--blue-light);color:var(--blue);display:flex;align-items:center;justify-content:center;}
.upzone-t{font-size:14px;color:var(--txt);font-weight:600;margin-bottom:4px;}
.upzone-s{font-size:12px;color:var(--txt3);}

.btn-p{
  display:inline-flex;align-items:center;gap:6px;padding:10px 16px;
  background:var(--blue);color:white;border:none;border-radius:8px;
  font-size:13px;font-weight:600;cursor:pointer;transition:all .15s;white-space:nowrap;
}
.btn-p:hover{filter:brightness(1.1);}
.btn-s{
  padding:10px 16px;background:var(--surf);border:1px solid var(--border);
  color:var(--txt);border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;transition:all .15s;
}
.btn-s:hover{border-color:var(--blue);color:var(--blue);}

.post{
  background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  padding:20px;margin-bottom:16px;transition:border-color .15s;
}
.post:hover{border-color:var(--txt3);}
.post-hd{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
.post-author{font-size:14px;font-weight:600;cursor:pointer;transition:color .15s;}
.post-author:hover{color:var(--blue);}
.post-meta{font-size:12px;color:var(--txt3);display:flex;align-items:center;gap:6px;margin-top:2px;}
.post-dot{width:3px;height:3px;border-radius:50%;background:var(--txt3);}
.post-txt{font-size:15px;line-height:1.7;color:var(--txt);margin-bottom:14px;}
.post-acts{display:flex;gap:2px;padding-top:12px;border-top:1px solid var(--border);}
.act-btn{
  display:inline-flex;align-items:center;gap:6px;padding:8px 12px;font-size:12px;font-weight:500;
  color:var(--txt2);border-radius:8px;cursor:pointer;transition:all .15s;
  user-select:none;background:transparent;border:none;
}
.act-btn:hover{color:var(--blue);}
.act-btn.liked{color:#dc3545;}

.cmt-section{margin-top:16px;padding-top:16px;border-top:1px solid var(--border);}
.cmt{display:flex;gap:10px;padding:12px 0;align-items:flex-start;}
.cmt:not(:last-of-type){border-bottom:1px solid var(--border);}
.cmt-body{flex:1;min-width:0;}
.cmt-bubble{
  background:var(--surf);border-radius:12px;padding:10px 13px;
  display:inline-block;max-width:100%;word-wrap:break-word;
}
.cmt-author{font-size:12px;font-weight:600;margin-bottom:2px;color:var(--txt);}
.cmt-role{color:var(--txt3);font-weight:400;font-size:11px;}
.cmt-txt{font-size:13px;line-height:1.6;color:var(--txt);white-space:pre-wrap;word-break:break-word;}
.cmt-edit-ta{
  width:100%;background:var(--bg);border:1px solid var(--blue);border-radius:8px;
  padding:10px 12px;font-size:13px;outline:none;resize:vertical;min-height:60px;
}
.cmt-meta{font-size:11px;color:var(--txt3);margin-top:6px;margin-left:13px;display:flex;align-items:center;gap:8px;}
.cmt-act{background:none;border:none;color:var(--txt3);cursor:pointer;font-size:11px;font-weight:600;padding:0;display:inline-flex;align-items:center;gap:3px;transition:color .15s;}
.cmt-act:hover{color:var(--blue);}
.cmt-act.del:hover{color:#dc3545;}
.cmt-act.ok{color:#4caf50;}
.cmt-input-row{display:flex;gap:10px;align-items:flex-end;margin-top:16px;}
.cmt-input-wrap{
  flex:1;display:flex;align-items:center;background:var(--surf);
  border:1px solid var(--border);border-radius:20px;transition:border-color .15s;
}
.cmt-input-wrap:focus-within{border-color:var(--blue);}
.cmt-input{
  flex:1;background:transparent;border:none;outline:none;padding:10px 14px;
  font-size:13px;resize:none;max-height:100px;font-family:inherit;
}
.cmt-input::placeholder{color:var(--txt3);}
.cmt-send{
  width:36px;height:36px;margin-right:4px;border-radius:50%;
  background:var(--blue);color:white;border:none;
  display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;
  transition:all .15s;
}
.cmt-send:hover:not(:disabled){filter:brightness(1.1);}
.cmt-send:disabled{background:var(--border);color:var(--txt3);cursor:not-allowed;}

.profile-banner{height:220px;position:relative;overflow:hidden;border-radius:0 0 12px 12px;background:#1e88e5;}
.profile-av-frame{position:absolute;bottom:-44px;left:32px;padding:4px;background:var(--bg);border-radius:50%;box-shadow:var(--sh2);}
.profile-body{display:grid;grid-template-columns:240px 1fr;gap:28px;padding:60px 28px 0;}
.profile-name{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-bottom:2px;}
.profile-role{font-size:14px;color:var(--txt2);margin-bottom:4px;}
.profile-bio{font-size:14px;color:var(--txt2);line-height:1.7;margin-bottom:16px;}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.badge{
  font-size:11px;font-weight:600;padding:5px 10px;border-radius:6px;
  background:var(--surf);color:var(--txt2);border:1px solid var(--border);display:inline-flex;align-items:center;gap:4px;
}
.badge.blue{background:var(--blue-light);color:var(--blue);border-color:var(--blue);}

.photo-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;max-height:calc(100vh - 280px);overflow-y:auto;}
.photo{aspect-ratio:1;border-radius:8px;cursor:pointer;overflow:hidden;transition:transform .15s;background:var(--surf);}
.photo:hover{transform:scale(1.06);z-index:1;}
.photo img{width:100%;height:100%;object-fit:cover;}
.photo-ph{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--txt3);font-weight:700;}

.co-card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:16px;}
.co-head{display:flex;gap:14px;align-items:flex-start;margin-bottom:12px;}
.co-logo{width:56px;height:56px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:800;color:white;background:#1e88e5;flex-shrink:0;}
.co-name{font-size:16px;font-weight:700;letter-spacing:-.01em;margin-bottom:3px;}

.featured{
  background:var(--blue-light);border:1px solid var(--blue);border-radius:12px;padding:16px;margin-bottom:18px;
}
.feat-t{font-size:14px;font-weight:700;letter-spacing:-.01em;margin-bottom:4px;color:var(--txt);}
.feat-s{font-size:12px;color:var(--txt2);margin-bottom:12px;}
.stat-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.stat{background:white;border:1px solid var(--border);border-radius:8px;padding:12px;text-align:center;}
.stat-n{font-size:20px;font-weight:700;color:var(--blue);}
.stat-l{font-size:10px;color:var(--txt3);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}

.lb{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:1000;cursor:zoom-out;backdrop-filter:blur(10px);}
.lb img{max-width:90vw;max-height:90vh;border-radius:8px;cursor:default;box-shadow:var(--sh2);}
.lb-close{position:absolute;top:20px;right:24px;width:44px;height:44px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:50%;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;}
.lb-close:hover{background:rgba(255,255,255,.2);}

.login-pg{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);padding:24px;position:relative;overflow:hidden;}
.login-pg::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 20%,var(--blue-light),transparent 40%);pointer-events:none;}
.login-card{
  background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  padding:40px 36px;width:100%;max-width:440px;box-shadow:var(--sh2);position:relative;z-index:1;
}
.login-sub{font-size:14px;color:var(--txt2);text-align:center;margin:12px 0 28px;}
.field{margin-bottom:16px;}
.field-l{font-size:12px;font-weight:600;color:var(--txt2);margin-bottom:6px;display:block;}
.inp,.sel{
  width:100%;background:var(--surf);border:1px solid var(--border);border-radius:8px;
  padding:12px 14px;font-size:14px;outline:none;transition:border-color .15s,box-shadow .15s;
}
.inp:focus,.sel:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-light);}
.pw-wrap{position:relative;}
.pw-wrap .inp{padding-right:44px;}
.eye-btn{
  position:absolute;right:8px;top:50%;transform:translateY(-50%);
  background:transparent;border:none;color:var(--txt3);cursor:pointer;
  padding:8px;border-radius:6px;display:flex;align-items:center;transition:all .15s;
}
.eye-btn:hover{color:var(--blue);background:var(--blue-light);}
.btn-cta{
  width:100%;padding:12px;background:var(--blue);color:white;border:none;border-radius:8px;
  font-size:14px;font-weight:700;cursor:pointer;transition:all .15s;margin-top:8px;
}
.btn-cta:hover{filter:brightness(1.1);}
.btn-cta:disabled{opacity:.6;cursor:not-allowed;}
.err{
  font-size:12px;color:#dc3545;background:rgba(220,53,69,.08);border:1px solid rgba(220,53,69,.2);
  padding:10px 12px;border-radius:8px;margin-bottom:12px;
}
.hint{background:var(--surf);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:12px;color:var(--txt2);line-height:1.6;}
.hint code{background:var(--border);padding:2px 6px;border-radius:4px;font-size:11px;color:var(--blue);}

.npop{
  position:fixed;top:72px;right:20px;width:340px;
  background:var(--bg2);border:1px solid var(--border);border-radius:12px;
  padding:16px;z-index:200;box-shadow:var(--sh2);
}
.npop-t{font-size:10px;font-weight:700;color:var(--txt3);margin-bottom:12px;text-transform:uppercase;letter-spacing:.1em;}

.mob-toggle,.mob-overlay{display:none;}

::-webkit-scrollbar{width:6px;height:6px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}

@media(max-width:1100px){.layout{grid-template-columns:240px 1fr;}.side.r{display:none;}}
@media(max-width:768px){
  .layout{grid-template-columns:1fr;}
  .side.l{position:fixed;top:64px;left:0;bottom:0;width:300px;background:var(--bg2);z-index:90;transform:translateX(-100%);transition:transform .25s;border-right:1px solid var(--border);}
  .side.l.open{transform:translateX(0);}
  .mob-overlay.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:89;}
  .mob-toggle{display:inline-flex;}
  .bar-search{display:none;}
  .main{padding:20px 16px 48px;}
  .profile-body{grid-template-columns:1fr;padding:58px 16px 0;}
  .collage-grid{grid-template-columns:repeat(3,1fr);grid-auto-rows:100px;}
  .photo-grid{grid-template-columns:repeat(3,1fr);}
  .user-pill span{display:none;}
  .btn-ghost{display:none;}
}
@media(max-width:480px){
  .collage-grid{grid-template-columns:repeat(2,1fr);}
  .login-card{padding:30px 22px;}
  .post-acts{gap:0;}
  .act-btn{padding:6px 9px;font-size:11px;}
}
`;

/* COMPONENTS */
function Av({ m, size = "md" }) {
  return <div className={`av ${size}`}>{m.initials}</div>;
}

function LoginPage({ onLogin }) {
  const [sel, setSel] = useState("");
  const [pw, setPw] = useState("");
  const [show, setShow] = useState(false);
  const [err, setErr] = useState("");
  const [loading, setLoading] = useState(false);
  const { theme, toggle } = useTheme();

  const doLogin = async () => {
    if (!sel) { setErr("Please select a member."); return; }
    setLoading(true); setErr("");
    try {
      const r = await api.login(sel, pw);
      onLogin(r.user, r.token);
    } catch (e) { setErr(e.message || "Sign in failed."); }
    finally { setLoading(false); }
  };

  return (
    <div className="login-pg">
      <button className="ib" onClick={toggle} style={{ position:"absolute", top:24, right:24, zIndex:2 }}>
        {theme === "light" ? <Ic.Sun /> : <Ic.Moon />}
      </button>
      <div className="login-card">
        <div style={{ display:"flex", justifyContent:"center", marginBottom:"16px" }}>
          <Logo />
        </div>
        <div className="login-sub">Your private business network · 17 members</div>

        <div className="hint">
          <strong>Demo login</strong> — pick any member. Password: <code>firstname + 2024</code>
        </div>

        <div className="field">
          <label className="field-l">Profile</label>
          <select className="sel" value={sel} onChange={e => { setSel(e.target.value); setErr(""); }}>
            <option value="">— Choose member —</option>
            {MEMBERS.map(m => <option key={m.id} value={m.id}>{m.name} · {m.company}</option>)}
          </select>
        </div>

        <div className="field">
          <label className="field-l">Password</label>
          <div className="pw-wrap">
            <input className="inp" type={show ? "text" : "password"} placeholder="Enter password"
              value={pw}
              onChange={e => { setPw(e.target.value); setErr(""); }}
              onKeyDown={e => e.key === "Enter" && doLogin()}
              autoComplete="current-password"
            />
            <button type="button" className="eye-btn" onClick={() => setShow(s => !s)} tabIndex={-1}>
              {show ? <Ic.EyeOff /> : <Ic.Eye />}
            </button>
          </div>
        </div>

        {err && <div className="err">{err}</div>}
        <button className="btn-cta" onClick={doLogin} disabled={loading}>
          {loading ? "Signing in…" : "Sign in"}
        </button>
      </div>
    </div>
  );
}

function Comment({ cmt, currentUser, onEdit, onDelete }) {
  const author = MEMBERS.find(m => m.id === cmt.authorId);
  const isOwn = cmt.authorId === currentUser.id;
  const [editing, setEditing] = useState(false);
  const [draft, setDraft] = useState(cmt.text);
  const taRef = useRef();

  useEffect(() => {
    if (editing && taRef.current) {
      taRef.current.focus();
      const len = taRef.current.value.length;
      taRef.current.setSelectionRange(len, len);
    }
  }, [editing]);

  const save = () => {
    const t = draft.trim();
    if (!t) return;
    onEdit(cmt.id, t);
    setEditing(false);
  };
  const cancel = () => { setDraft(cmt.text); setEditing(false); };

  if (!author) return null;
  return (
    <div className="cmt">
      <Av m={author} size="sm" />
      <div className="cmt-body">
        <div className="cmt-bubble">
          <div className="cmt-author">{author.name}<span className="cmt-role"> · {author.role}</span></div>
          {!editing && <div className="cmt-txt">{cmt.text}</div>}
          {editing && (
            <textarea
              ref={taRef}
              className="cmt-edit-ta"
              value={draft}
              onChange={e => setDraft(e.target.value)}
              onKeyDown={e => {
                if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); save(); }
                if (e.key === "Escape") cancel();
              }}
            />
          )}
        </div>
        <div className="cmt-meta">
          <span>{cmt.time}{cmt.edited ? " · edited" : ""}</span>
          {isOwn && !editing && (
            <>
              <button className="cmt-act" onClick={() => setEditing(true)}><Ic.Edit /> Edit</button>
              <button className="cmt-act del" onClick={() => onDelete(cmt.id)}><Ic.Trash /> Delete</button>
            </>
          )}
          {isOwn && editing && (
            <>
              <button className="cmt-act ok" onClick={save}><Ic.Check /> Save</button>
              <button className="cmt-act" onClick={cancel}>Cancel</button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

function CmtInput({ currentUser, onSubmit }) {
  const [txt, setTxt] = useState("");
  const go = () => {
    const t = txt.trim();
    if (!t) return;
    onSubmit(t);
    setTxt("");
  };
  return (
    <div className="cmt-input-row">
      <Av m={currentUser} size="sm" />
      <div className="cmt-input-wrap">
        <textarea
          className="cmt-input"
          rows={1}
          placeholder="Write a comment…"
          value={txt}
          onChange={e => setTxt(e.target.value)}
          onKeyDown={e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); go(); } }}
        />
        <button className="cmt-send" onClick={go} disabled={!txt.trim()} aria-label="Send">
          <Ic.Send />
        </button>
      </div>
    </div>
  );
}

function PostCard({ post, currentUser, comments, onAdd, onEdit, onDelete }) {
  const author = MEMBERS.find(m => m.id === post.memberId);
  const [liked, setLiked] = useState(false);
  const [open, setOpen] = useState(false);
  const list = comments || [];

  return (
    <div className="post">
      <div className="post-hd">
        <Av m={author} size="md" />
        <div style={{ flex:1 }}>
          <div className="post-author">{author.name}</div>
          <div className="post-meta">
            <span>{author.role}</span>
            <span className="post-dot"/>
            <span>{author.company}</span>
            <span className="post-dot"/>
            <span>{post.time}</span>
          </div>
        </div>
      </div>
      <div className="post-txt">{post.text}</div>
      <div className="post-acts">
        <button className={`act-btn${liked ? " liked" : ""}`} onClick={() => setLiked(l => !l)}>
          <Ic.Heart filled={liked} /> {post.likes + (liked ? 1 : 0)}
        </button>
        <button className="act-btn" onClick={() => setOpen(o => !o)}>
          <Ic.Chat /> {list.length}
        </button>
        <button className="act-btn"><Ic.Share /> Share</button>
      </div>

      {open && (
        <div className="cmt-section">
          {list.length === 0 && (
            <div style={{ fontSize:12, color:"var(--txt3)", padding:"6px 0 10px" }}>No comments yet.</div>
          )}
          {list.map(c => (
            <Comment key={c.id} cmt={c} currentUser={currentUser} onEdit={(id, t) => onEdit(post.id, id, t)} onDelete={(id) => onDelete(post.id, id)} />
          ))}
          <CmtInput currentUser={currentUser} onSubmit={t => onAdd(post.id, t)} />
        </div>
      )}
    </div>
  );
}

function Collage({ photos, onUpload }) {
  const fileRef = useRef();
  const [drag, setDrag] = useState(false);
  const [lb, setLb] = useState(null);

  const handle = files => {
    const imgs = Array.from(files).filter(f => f.type.startsWith("image/"));
    if (imgs.length) onUpload(imgs);
  };

  const sized = photos.map((p, i) => {
    let cls = "";
    if (i === 0) cls = "lg";
    else if (i === 3) cls = "tall";
    else if (i === 5) cls = "wide";
    return { ...p, cls };
  });

  return (
    <div className="collage">
      <div className="collage-head">
        <div>
          <div className="collage-tit">Germany Trip</div>
          <div className="collage-sub">{photos.length} photos</div>
        </div>
        <button className="btn-p" onClick={() => fileRef.current?.click()}>
          <Ic.Plus /> Add photos
        </button>
        <input ref={fileRef} type="file" accept="image/*" multiple style={{ display:"none" }} onChange={e => handle(e.target.files)} />
      </div>
      <div
        className="collage-grid"
        onDragOver={e => { e.preventDefault(); setDrag(true); }}
        onDragLeave={() => setDrag(false)}
        onDrop={e => { e.preventDefault(); setDrag(false); handle(e.dataTransfer.files); }}
        style={drag ? { background:"var(--blue-light)" } : undefined}
      >
        {sized.map(p => (
          <div key={p.id} className={`ctile ${p.cls}`} onClick={() => setLb(p)}>
            {p.src ? <img src={p.src} alt={p.caption} /> : <div className="ctile-ph">{p.caption}</div>}
          </div>
        ))}
      </div>
      {lb && (
        <div className="lb" onClick={() => setLb(null)}>
          <button className="lb-close" onClick={() => setLb(null)}><Ic.X /></button>
          {lb.src
            ? <img src={lb.src} alt={lb.caption} onClick={e => e.stopPropagation()} />
            : <div onClick={e => e.stopPropagation()} style={{ fontSize:18, color:"white", fontWeight:600 }}>{lb.caption}</div>
          }
        </div>
      )}
    </div>
  );
}

function PhotoSidebar({ photos, onClick, isOwner, onUpload }) {
  const fileRef = useRef();
  const [drag, setDrag] = useState(false);
  return (
    <div>
      {isOwner && (
        <div className={`upzone${drag ? " drag" : ""}`}
          onClick={() => fileRef.current?.click()}
          onDragOver={e => { e.preventDefault(); setDrag(true); }}
          onDragLeave={() => setDrag(false)}
          onDrop={e => { e.preventDefault(); setDrag(false); const imgs = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith("image/")); if (imgs.length) onUpload(imgs); }}
        >
          <div className="upzone-ico"><Ic.Camera /></div>
          <div className="upzone-t">Upload photos</div>
          <div className="upzone-s">Drag & drop or click</div>
          <input ref={fileRef} type="file" accept="image/*" multiple style={{ display:"none" }} onChange={e => onUpload(Array.from(e.target.files))} />
        </div>
      )}
      <div className="sec-lbl">Photos<span className="sec-cnt">{photos.length}</span></div>
      <div className="photo-grid">
        {photos.map(p => (
          <div key={p.id} className="photo" onClick={() => onClick(p)}>
            {p.src ? <img src={p.src} alt={p.caption} /> : <div className="photo-ph">{p.id}</div>}
          </div>
        ))}
      </div>
    </div>
  );
}

function ProfilePage({ member, currentUser, allPhotos, onUpload }) {
  const [lb, setLb] = useState(null);
  const isOwner = currentUser.id === member.id;
  const photos = allPhotos[member.id] || genPhotos(member.id);

  return (
    <div style={{ paddingBottom:48 }}>
      <div className="profile-banner" />
      <div className="profile-av-frame"><Av m={member} size="xl" /></div>
      <div className="profile-body">
        <div>
          <PhotoSidebar photos={photos} onClick={setLb} isOwner={isOwner} onUpload={files => onUpload(member.id, files)} />
        </div>
        <div>
          <div className="profile-name">{member.name}</div>
          <div className="profile-role">{member.role}</div>
          <div className="profile-bio">{member.bio}</div>
          <div className="badges">
            <span className="badge">{member.city}</span>
            <span className="badge">Joined {member.joined}</span>
            {isOwner && <span className="badge blue">You</span>}
          </div>
          {!isOwner && (
            <div style={{ display:"flex", gap:10, marginBottom:18 }}>
              <button className="btn-p"><Ic.Plus /> Connect</button>
              <button className="btn-s">Message</button>
            </div>
          )}
          <div className="co-card">
            <div className="co-head">
              <div className="co-logo">{member.company.slice(0,2).toUpperCase()}</div>
              <div>
                <div className="co-name">{member.company}</div>
                <div style={{ fontSize:12, color:"var(--txt3)", marginBottom:8 }}>{member.city} · {member.role}</div>
              </div>
            </div>
            <div style={{ fontSize:13, color:"var(--txt2)", lineHeight:1.6 }}>{member.bio}</div>
          </div>
        </div>
      </div>
      {lb && (
        <div className="lb" onClick={() => setLb(null)}>
          <button className="lb-close" onClick={() => setLb(null)}><Ic.X /></button>
          {lb.src
            ? <img src={lb.src} alt={lb.caption} onClick={e => e.stopPropagation()} />
            : <div onClick={e => e.stopPropagation()} style={{ fontSize:40, color:"white", fontWeight:800 }}>{lb.id}</div>
          }
        </div>
      )}
    </div>
  );
}

function HomeFeed({ currentUser, collage, onCollageUpload, postCmts, onAddCmt, onEditCmt, onDelCmt }) {
  return (
    <div className="main">
      <div className="page-h">Home</div>
      <div className="page-sub">Welcome back · catch up with your network</div>
      <Collage photos={collage} onUpload={onCollageUpload} />
      {FEED_POSTS.map(p => (
        <PostCard key={p.id} post={p} currentUser={currentUser} comments={postCmts[p.id]} onAdd={onAddCmt} onEdit={onEditCmt} onDelete={onDelCmt} />
      ))}
    </div>
  );
}

function MainApp() {
  const [user, setUser] = useState(null);
  const [page, setPage] = useState("feed");
  const [notifOpen, setNotifOpen] = useState(false);
  const [allPhotos, setAllPhotos] = useState({});
  const [collage, setCollage] = useState(GERMAN_TRIP_SEED);
  const [mobNav, setMobNav] = useState(false);
  const [search, setSearch] = useState("");
  const [postCmts, setPostCmts] = useState(() => {
    try { const c = localStorage.getItem("cu-cmts"); return c ? JSON.parse(c) : SEED_COMMENTS; } catch { return SEED_COMMENTS; }
  });
  const { theme, toggle } = useTheme();

  useEffect(() => {
    try { const s = localStorage.getItem("cu-session"); if (s) { const { u } = JSON.parse(s); if (u) setUser(u); } } catch {}
  }, []);

  useEffect(() => {
    try { localStorage.setItem("cu-cmts", JSON.stringify(postCmts)); } catch {}
  }, [postCmts]);

  const login = (u) => {
    setUser(u);
    try { localStorage.setItem("cu-session", JSON.stringify({ u })); } catch {}
  };
  const logout = () => {
    setUser(null);
    try { localStorage.removeItem("cu-session"); } catch {}
  };

  const uploadPhotos = useCallback(async (memberId, files) => {
    const np = await api.uploadPhotos(memberId, files);
    setAllPhotos(prev => ({
      ...prev,
      [memberId]: [...(prev[memberId] || genPhotos(memberId)), ...np],
    }));
  }, []);

  const uploadCollage = useCallback(async (files) => {
    const np = await api.uploadCollagePhotos(files);
    setCollage(prev => [...np, ...prev]);
  }, []);

  const addCmt = (postId, text) => {
    if (!user) return;
    const c = { id:`c-${Date.now()}`, postId, authorId:user.id, text, time:"just now", edited:false };
    setPostCmts(prev => ({ ...prev, [postId]: [...(prev[postId] || []), c] }));
  };
  const editCmt = (postId, cId, text) => {
    setPostCmts(prev => ({
      ...prev,
      [postId]: (prev[postId] || []).map(c => c.id === cId ? { ...c, text, edited:true } : c),
    }));
  };
  const delCmt = (postId, cId) => {
    setPostCmts(prev => ({ ...prev, [postId]: (prev[postId] || []).filter(c => c.id !== cId) }));
  };

  const filtered = useMemo(() => {
    const q = search.trim().toLowerCase();
    if (!q) return MEMBERS;
    return MEMBERS.filter(m =>
      m.name.toLowerCase().includes(q) ||
      m.company.toLowerCase().includes(q) ||
      m.role.toLowerCase().includes(q)
    );
  }, [search]);

  if (!user) return <LoginPage onLogin={login} />;
  const activeMember = page !== "feed" ? MEMBERS.find(m => m.id === parseInt(page)) : null;

  return (
    <>
      <div className="bar">
        <button className="ib mob-toggle" onClick={() => setMobNav(true)}><Ic.Menu /></button>
        <Logo onClick={() => setPage("feed")} />
        <div className="bar-search">
          <span className="bar-search-ico"><Ic.Search /></span>
          <input placeholder="Search members…" value={search} onChange={e => setSearch(e.target.value)} />
        </div>
        <div className="bar-r">
          <button className="ib" onClick={toggle}>{theme === "light" ? <Ic.Sun /> : <Ic.Moon />}</button>
          <button className="ib" onClick={() => setNotifOpen(o => !o)}><Ic.Bell /><span className="notif-dot"/></button>
          <div className="user-pill" onClick={() => setPage(String(user.id))}>
            <Av m={user} size="sm" />
            <span>{user.name.split(" ")[0]}</span>
          </div>
          <button className="btn-ghost" onClick={logout}>Sign out</button>
        </div>
      </div>

      {notifOpen && (
        <div className="npop">
          <div className="npop-t">Notifications</div>
          {NOTIFICATIONS.map(n => {
            const m = MEMBERS.find(x => x.id === n.memberId);
            return (
              <div key={n.id} className="ni" onClick={() => { setPage(String(n.memberId)); setNotifOpen(false); }}>
                <Av m={m} size="xs" />
                <div style={{ flex:1 }}>
                  <div className="ni-txt">{n.text}</div>
                  <div className="ni-time">{n.time} ago</div>
                </div>
              </div>
            );
          })}
        </div>
      )}

      <div className={`mob-overlay${mobNav ? " show" : ""}`} onClick={() => setMobNav(false)} />

      <div className="layout">
        <div className={`side l${mobNav ? " open" : ""}`}>
          <div className="sec">
            <div className="sec-lbl">Members<span className="sec-cnt">{filtered.length}</span></div>
            {filtered.map(m => (
              <div key={m.id} className={`mrow${page === String(m.id) ? " act" : ""}`}
                onClick={() => { setPage(String(m.id)); setMobNav(false); }}>
                <Av m={m} size="md" />
                <div className="mrow-info">
                  <div className="mrow-name">{m.name}</div>
                  <div className="mrow-sub">{m.role}</div>
                </div>
                <div className="odot" />
              </div>
            ))}
          </div>
        </div>

        {page === "feed"
          ? <HomeFeed currentUser={user} collage={collage} onCollageUpload={uploadCollage} postCmts={postCmts} onAddCmt={addCmt} onEditCmt={editCmt} onDelCmt={delCmt} />
          : activeMember
            ? <div className="main" style={{ padding:0 }}><ProfilePage member={activeMember} currentUser={user} allPhotos={allPhotos} onUpload={uploadPhotos} /></div>
            : <HomeFeed currentUser={user} collage={collage} onCollageUpload={uploadCollage} postCmts={postCmts} onAddCmt={addCmt} onEditCmt={editCmt} onDelCmt={delCmt} />
        }

        <div className="side r">
          <div className="sec-lbl">Network</div>
          <div className="featured">
            <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:10 }}>
              <Logo collapsed />
            </div>
            <div className="stat-g">
              <div className="stat"><div className="stat-n">17</div><div className="stat-l">Members</div></div>
              <div className="stat"><div className="stat-n">100%</div><div className="stat-l">Active</div></div>
              <div className="stat"><div className="stat-n">6K+</div><div className="stat-l">Photos</div></div>
              <div className="stat"><div className="stat-n">8</div><div className="stat-l">Cities</div></div>
            </div>
          </div>
          <div className="sec-lbl">All Members</div>
          {MEMBERS.map(m => (
            <div key={m.id} className={`mrow${page === String(m.id) ? " act" : ""}`} onClick={() => setPage(String(m.id))}>
              <Av m={m} size="sm" />
              <div className="mrow-info">
                <div className="mrow-name">{m.name}</div>
                <div className="mrow-sub">{m.company}</div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </>
  );
}

function App() {
  return (
    <ThemeProvider>
      <style>{CSS}</style>
      <MainApp />
    </ThemeProvider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
